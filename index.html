<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nrkcb Developer</title>
<meta name="description" content="nrkcb, développeur de l'application POWTV. Tous les liens.">
<link rel="icon" href="nrkcb.png">
<meta property="og:title" content="nrkcb Developer">
<meta property="og:description" content="Développeur de l'application POWTV. Tous les liens.">
<meta property="og:image" content="nrkcb.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --fg:#fff; --muted:#a3a3a3; --red:#E50914; --card:#141414; --line:#262626; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; min-height:100vh; display:flex; justify-content:center; padding:40px 16px; }
  main { width:100%; max-width:440px; text-align:center; }
  .avatar { width:120px; height:120px; border-radius:50%; display:block; margin:0 auto 16px; border:1px solid var(--line); }
  .bio { color:var(--muted); line-height:1.5; margin-bottom:28px; }
  a.btn { display:block; padding:16px 20px; margin-bottom:12px; border-radius:14px; background:var(--card); border:1px solid var(--line); color:var(--fg); text-decoration:none; font-weight:600; transition:transform .15s, border-color .15s; }
  a.btn:hover { transform:translateY(-2px); border-color:var(--red); }
  a.btn.main { background:var(--red); border-color:var(--red); }
  a.btn small { display:block; font-weight:400; color:var(--muted); margin-top:4px; font-size:13px; }
  a.btn.main small { color:#ffd6d8; }
  .app { border:1px solid var(--line); border-radius:20px; padding:20px 16px 8px; margin-bottom:20px; }
  .app-head { display:flex; align-items:center; gap:14px; text-align:left; margin-bottom:12px; }
    .app-head h2 { font-family:Anton,Impact,sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:-0.04em; font-size:34px; line-height:1; }
  .app-head h2 span { color:var(--red); }
  .app-head p { color:var(--muted); font-size:14px; margin-top:4px; }
  .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.12em; margin:0 0 12px; }
  footer { color:var(--muted); font-size:12px; margin-top:20px; line-height:1.5; }
</style>
</head>
<body>
<main>
  <img class="avatar" src="nrkcb.png" alt="nrkcb Developer">
  <p class="bio" data-fr="Je crée POWTV, pour regarder ses contenus sur tous ses écrans." data-en="I build POWTV, to watch your own content on every screen.">Je crée POWTV, pour regarder ses contenus sur tous ses écrans.</p>

  <p class="label" data-fr="Mon application" data-en="My app">Mon application</p>
  <section class="app">
    <div class="app-head">
      <div>
        <h2>POWTV<span>.</span></h2>
        <p data-fr="Lecteur IPTV pour mobile, Android TV, Fire TV et Windows." data-en="IPTV player for mobile, Android TV, Fire TV and Windows.">Lecteur IPTV pour mobile, Android TV, Fire TV et Windows.</p>
      </div>
    </div>
    <a class="btn main" href="https://powtv.app/?utm_source=instagram&utm_medium=bio">
      <span data-fr="Site officiel" data-en="Official website">Site officiel</span>
      <small>powtv.app</small>
    </a>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.nrkcb.powtv_mobile">
      <span data-fr="Application mobile et TV" data-en="Mobile &amp; TV app">Application mobile et TV</span>
      <small>Google Play</small>
    </a>
    <a class="btn" href="https://powtv.app/iptv-fire-tv?utm_source=instagram&utm_medium=bio">Fire TV</a>
    <a class="btn" href="https://powtv.app/iptv-windows?utm_source=instagram&utm_medium=bio">Windows</a>
    <a class="btn" href="https://powtv.app/guide?utm_source=instagram&utm_medium=bio">
      <span data-fr="Guide de démarrage" data-en="Getting started guide">Guide de démarrage</span>
    </a>
  </section>


  <footer data-fr="POWTV est un lecteur : aucune chaîne ni contenu fourni." data-en="POWTV is a player: no channels or content provided.">POWTV est un lecteur : aucune chaîne ni contenu fourni.</footer>
</main>
<script>
  if (!(navigator.language || "fr").toLowerCase().startsWith("fr")) {
    document.documentElement.lang = "en";
    document.querySelectorAll("[data-en]").forEach(function (el) { el.textContent = el.dataset.en; });
  }
</script>
</body>
</html>
